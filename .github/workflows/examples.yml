name: Example compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/check_examples.py
